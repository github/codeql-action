# PR checks to exclude from required checks
contains:
  - "ESLint"
  - "https://"
  - "test-setup-python-scripts"
  - "update"
  - "Update"
  # Matrix-ed job; the name starts with this
  - "Create backport"
is:
  - "Agent"
  - "check-expected-release-files"
  - "Cleanup artifacts"
  - "CodeQL"
  - "copilot-pull-request-reviewer"
  - "Dependabot"
  - "Label PR with size"
  - "Post repo size comment"
  - "Prepare"
  - "Release info"
  - "Upload results"
  - "Update release branch"
  # These checks are known not to run on every PR (for example, some release
  # PRs), so requiring them would block the PRs they don't run on.
  - "github-advanced-security"
  - "License compliance check"
  # Only runs when a PR is removed from the merge queue.
  - "Notify"
  # Jobs that `gh aw compile` generates for the `Update runner images` workflow, which only runs on
  # a schedule or when dispatched.
  - "activation"
  - "agent"
  - "conclusion"
  - "detection"
  - "safe_outputs"
