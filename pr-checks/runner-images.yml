# The GitHub-hosted runner images that the `runner-images` PR check runs on, identified by their
# labels.
#
# Each image has a required check. Before merging a PR that adds or removes images, a maintainer
# needs to wait for the PR's checks to finish, then update the required checks by running
# `pr-checks/sync-checks.ts` with `--ref` set to the PR's head commit.
#
# The check runs on each image listed in
# https://github.com/actions/runner-images#available-images, apart from the ones under `excluded`
# and any that GitHub is about to retire.
#
# The `Update runner images` workflow asks Copilot to keep this file up to date, following the
# instructions in `.github/workflows/update-runner-images.md`.
images:
  # The Ubuntu 22.04 images have brownouts from 23 March 2027 and are retired on 17 April 2027, so
  # remove them before the brownouts start.
  # See https://github.com/actions/runner-images/issues/14254.
  - ubuntu-22.04
  - ubuntu-22.04-arm
  - ubuntu-24.04
  - ubuntu-24.04-arm
  - ubuntu-26.04
  - ubuntu-26.04-arm
  - windows-2022
  - windows-2025
  # Use larger runners for macOS to keep these jobs off the critical path.
  - macos-15-large
  - macos-15-xlarge
  - macos-26-large
  - macos-26-xlarge
# The images that the check doesn't run on, with the reasons.
excluded:
  ubuntu-slim: >
    It's intended for lightweight jobs rather than builds like the ones this check runs.
  windows-11-arm: >
    CodeQL doesn't support Windows on Arm64.
  xcode-27: >
    CodeQL doesn't support traced analysis on macOS 27 or later, or with Xcode 27 or later.
    The `unsupported-macos` check runs on this image instead.
